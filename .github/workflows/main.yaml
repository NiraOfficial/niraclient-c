name: build

on: [push]

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.TRIPLET }}-

      - name: Install Dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install

      - name: Build niraclient
        run: |
          call build.bat ${{ env.MY_TRIPLET }} > build_output.txt 2>&1
          set BUILD_EXITCODE=%ERRORLEVEL%
          type build_output.txt
          if not "%BUILD_EXITCODE%"=="0" powershell -Command "$t = (Get-Content build_output.txt -Tail 50) -join '%%0A'; Write-Output \"::error::$t\""
          exit /b %BUILD_EXITCODE%
        shell: cmd

      - name: Run Tests (Standard)
        shell: cmd
        env:
          APP_KEY_ID_UPLOADTEST: ${{ secrets.APP_KEY_ID_UPLOADTEST }}
          APP_KEY_SECRET_UPLOADTEST: ${{ secrets.APP_KEY_SECRET_UPLOADTEST }}
        run: |
          niraclient.exe > test_output.txt 2>&1
          set TEST_EXITCODE=%ERRORLEVEL%
          type test_output.txt
          if not "%TEST_EXITCODE%"=="0" powershell -Command "$t = (Get-Content test_output.txt -Tail 50) -join '%%0A'; Write-Output \"::error::$t\""
          exit /b %TEST_EXITCODE%

      - name: Run Tests (Forced Uploads)
        shell: cmd
        env:
          NIRA_FORCE_FILE_UPLOADS: 1
          APP_KEY_ID_UPLOADTEST: ${{ secrets.APP_KEY_ID_UPLOADTEST }}
          APP_KEY_SECRET_UPLOADTEST: ${{ secrets.APP_KEY_SECRET_UPLOADTEST }}
        run: |
          niraclient.exe > test_output.txt 2>&1
          set TEST_EXITCODE=%ERRORLEVEL%
          type test_output.txt
          if not "%TEST_EXITCODE%"=="0" powershell -Command "$t = (Get-Content test_output.txt -Tail 50) -join '%%0A'; Write-Output \"::error::$t\""
          exit /b %TEST_EXITCODE%

      - name: Prepare for Artifact
        run: |
          mkdir -p dist
          cp niraclient.exe dist/
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: niraclient-win64
          path: dist/
          if-no-files-found: error
          retention-days: 7
